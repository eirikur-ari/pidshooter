name: Snapshot

on:
  push:
    branches-ignore: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Snapshot verify
    uses: ./.github/workflows/_verify.yaml
    permissions:
      contents: read

  build:
    name: Snapshot build
    needs: verify
    uses: ./.github/workflows/_build.yaml
    permissions:
      contents: read
