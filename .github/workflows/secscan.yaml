name: Security Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [master]
    paths:
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vulnerability Lint
        id: vulnlint
        shell: bash
        run: make vuln-lint 2>&1 | tee "$RUNNER_TEMP/vuln-lint-result.txt"

      - name: Report Vulnerability Lint
        if: ${{ failure() && steps.vulnlint.outcome == 'failure' }}
        run: bash .github/scripts/report-vuln-lint.sh "$RUNNER_TEMP/vuln-lint-result.txt"
