name: Build

on:
  workflow_call:
    inputs:
      coverage:
        description: Run the tests with coverage and upload the coverage profile
        type: boolean
        default: false
      acceptance:
        description: Build the binary and run the acceptance tests against it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        if: ${{ !inputs.coverage }}
        run: make test

      - name: Test with Coverage
        if: ${{ inputs.coverage }}
        run: make coverage

      - name: Coverage Summary
        if: ${{ inputs.coverage }}
        run: |
          echo "### Coverage (${{ matrix.os }}): $(make --silent coverage-summary)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Profile
        if: ${{ inputs.coverage && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-out
          path: build/coverage.out
          if-no-files-found: error
          retention-days: 1

      - name: Build
        run: make build

      - name: Acceptance Test
        if: ${{ inputs.acceptance }}
        run: make test-acceptance
